<article class="page page--essay">

    <h1 class="page__title">{{ page.title }}</h1>
    <span class="page__date">{{ page.date | date_to_string }}</span>
  </header>
  <div class="prose" data-reveal style="--i:1">
    {{ content }}
  </div>
</article>
