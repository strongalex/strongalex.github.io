# REQUIRED CHANGES
# Edit next line to provide your own name.
title: Alex Fenwick | Professional Portfolio
# Edit next line, replacing 'techfolios' with your github username
url: "https://strongalex.github.io"
# Edit next line so that baseurl is "" if your repo is <username>.github.io
baseurl: ""

# OPTIONAL CHANGES
## Specify the formatting for triple backquote code sections.
rouge-theme: github.css

## Visitor statistics (optional, off while this is empty). Uses GoatCounter: free for personal
## sites, no cookies, no consent banner. Create a site at https://www.goatcounter.com/signup, then
## put its code here (the "yourcode" in yourcode.goatcounter.com). Only the deployed site counts
## visits; local previews and drafts do not.
goatcounter: ""

# DON'T CHANGE THE FOLLOWING (unless you know what you're doing)
markdown: kramdown
kramdown:
  hard_wrap: false
  input: GFM
  syntax_highlighter: rouge
strict_front_matter: true
mathjax: true
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
include:
  - .nojekyll
  - _data
plugins:
  - jekyll-gist
