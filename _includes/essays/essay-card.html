<article class="card card--essay" data-reveal style="--i:{{ include.index }}">
  <div class="card__body">
    <div class="card__head">
      <h3 class="card__title">
        <a class="card__link" href="{% if page.essayurl %}{{ page.essayurl }}{% else %}{{ site.baseurl}}{{ include.page.url }}{% endif %}">{{ include.page.title }}</a>
      </h3>
    </div>
    <span class="card__date">{{ include.page.date | date_to_string }}</span>
    <p class="card__summary">{{ include.page.content | markdownify | strip_html | truncatewords: 40 }}</p>
    <ul class="tags">
      {% for label in include.page.labels %}
      <li>{{ label }}</li>
      {% endfor %}
    </ul>
    <span class="card__cta" aria-hidden="true">Read More<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </div>
</article>
