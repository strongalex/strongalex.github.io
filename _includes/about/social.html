<a href="{{ include.url }}" target="_blank" rel="noopener" class="{% if include.label %}contact-link{% else %}icon-btn{% endif %}"{% unless include.label %} aria-label="{{ include.name }}"{% endunless %}>
  <svg class="tf-social" aria-hidden="true">
    <use xlink:href="{{ '/img/bootstrap-icons.svg' | prepend: site.baseurl }}#{{- include.name -}}"/>
  </svg>
  {%- if include.label %}
  <span>{{ include.label }}</span>
  {%- endif %}
</a>
